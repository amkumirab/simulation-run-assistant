[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-run-assistant"
version = "0.11.0"
description = "A lightweight queue, dashboard, and notification layer for simulation sweeps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "amkumirab" }]
keywords = ["simulation", "comsol", "automation", "telegram", "scientific-computing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/amkumirab/simulation-run-assistant"
Repository = "https://github.com/amkumirab/simulation-run-assistant"
Issues = "https://github.com/amkumirab/simulation-run-assistant/issues"

[project.scripts]
sim-assistant = "simulation_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simulation_assistant = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
